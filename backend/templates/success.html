<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Successful</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">

  <!-- Navigation -->
  <nav class="bg-white shadow-md w-full absolute top-0">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex justify-center items-center py-4">
        <a href="/" class="text-xl font-bold text-blue-600">CrowdCheck</a>
      </div>
    </div>
  </nav>

  <!-- Success Box -->
  <div class="max-w-lg mx-auto text-center p-10 bg-white rounded-2xl shadow-lg border border-gray-200 mt-20">
    <div class="text-6xl mb-4 text-green-500">✔</div>
    <h1 class="text-3xl font-bold text-gray-800">Registration Successful!</h1>
    <p class="text-gray-600 mt-2 mb-6">
      Thank you, <strong class="font-semibold text-gray-700">{{ guardian_name }}</strong>. Your details have been saved.
    </p>
    
    <!-- Unique Key -->
    <div class="bg-gray-50 border-2 border-dashed border-gray-300 rounded-lg p-4 my-6">
      <p class="text-sm text-gray-500 mb-2">Your Unique Key is:</p>
      <p id="uniqueKey" class="text-2xl font-bold text-gray-800 tracking-widest bg-gray-200 p-3 rounded-md inline-block">
        {{ registration_id }}
      </p>
      <button id="copyButton" class="ml-3 bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold py-2 px-3 rounded-lg transition duration-300">
        Copy
      </button>
    </div>
    
    <p class="text-gray-500 text-sm mt-4">Please save this key. It can be used for future reference.</p>
    
    <!-- Start New Registration -->
    <a href="/" class="mt-8 inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300">
      Start New Registration
    </a>
  </div>

  <!-- Copy Button Script -->
  <script>
    const copyButton = document.getElementById('copyButton');
    const uniqueKey = document.getElementById('uniqueKey').textContent.trim();
    copyButton.addEventListener('click', () => {
      const textArea = document.createElement('textarea');
      textArea.value = uniqueKey;
      textArea.style.position = 'absolute';
      textArea.style.left = '-9999px';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        copyButton.textContent = 'Copied!';
      } catch (err) {
        console.error('Failed to copy text: ', err);
        copyButton.textContent = 'Error';
      }
      document.body.removeChild(textArea);
      setTimeout(() => { copyButton.textContent = 'Copy'; }, 2000);
    });
  </script>

</body>
</html>
