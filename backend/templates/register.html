<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-2xl bg-white p-8 rounded-2xl shadow-lg">

    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
        Event Registration Form
    </h2>

    <form action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data" class="space-y-6">

        <!-- Guardian Info -->
        <div>
            <h3 class="text-xl font-semibold text-gray-700 pb-2 border-b mb-4">Guardian Info</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="text" name="guardian_name" placeholder="Full Name" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg">

                <input type="text" name="guardian_phone" placeholder="Phone Number" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>

            <input type="text" name="address" placeholder="Address"
                class="w-full mt-4 px-4 py-2 border border-gray-300 rounded-lg">
        </div>

        <!-- Members -->
        <div>
            <h3 class="text-xl font-semibold text-gray-700 pb-2 border-b mb-4">Members Info</h3>

            <input type="text" name="members" placeholder="Member Names (comma separated)"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg">
        </div>

        <!-- Photos -->
        <div>
            <h3 class="text-xl font-semibold text-gray-700 pb-2 border-b mb-4">Photos</h3>

            <!-- Individual Photos -->
            <label class="block text-sm font-medium text-gray-600 mb-2">
                Individual Photos
            </label>

            <input
                type="file"
                name="individual_photos"
                id="individual_photos"
                multiple
                accept="image/*"
                class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
            >

            <div id="preview-individual" class="mt-4 flex flex-wrap gap-4"></div>

            <!-- Group Photo -->
            <label class="block text-sm font-medium text-gray-600 mt-6 mb-2">
                Group Photo
            </label>

            <input
                type="file"
                name="group_photo"
                id="group_photo"
                accept="image/*"
                class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
            >

            <div id="preview-group" class="mt-4"></div>
        </div>

        <!-- Submit -->
        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg">
            Register
        </button>

    </form>
</div>

<script>
    // preview individual images
    document.getElementById('individual_photos').addEventListener('change', function () {
        const preview = document.getElementById('preview-individual');
        preview.innerHTML = '';

        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'w-24 h-24 object-cover rounded-lg border';
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    // preview group image
    document.getElementById('group_photo').addEventListener('change', function () {
        const preview = document.getElementById('preview-group');
        preview.innerHTML = '';

        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'w-32 h-32 object-cover rounded-lg border';
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        }
    });

    // popup duplicate message
    {% if popup_message %}
        window.addEventListener('DOMContentLoaded', () => {
            alert("{{ popup_message }}");
        });
    {% endif %}
</script>

</body>
</html>
