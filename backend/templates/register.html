<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-2xl bg-white p-8 rounded-2xl shadow-lg">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Event Registration Form</h2>

    <!-- Registration Form -->
    <form action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <h3 class="text-xl font-semibold text-gray-700 pb-2 border-b mb-4">Guardian Info</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="guardian_name" class="block text-sm font-medium text-gray-600 mb-1">Full Name</label>
                    <input type="text" id="guardian_name" name="guardian_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="guardian_phone" class="block text-sm font-medium text-gray-600 mb-1">Phone Number</label>
                    <input type="text" id="guardian_phone" name="guardian_phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            <div class="mt-4">
                <label for="address" class="block text-sm font-medium text-gray-600 mb-1">Address</label>
                <input type="text" id="address" name="address" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
        </div>

        <div>
            <h3 class="text-xl font-semibold text-gray-700 pb-2 border-b mb-4">Members Info</h3>
            <div>
                <label for="members" class="block text-sm font-medium text-gray-600 mb-1">Member Names (comma separated)</label>
                <input type="text" id="members" name="members" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
        </div>

        <div>
            <h3 class="text-xl font-semibold text-gray-700 pb-2 border-b mb-4">Photos</h3>
            <div class="space-y-6">
                <div>
                    <label for="individual_photos" class="block text-sm font-medium text-gray-600 mb-2">Individual Photos</label>
                    <input type="file" name="individual_photos" id="individual_photos" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <div id="preview-individual" class="mt-4 flex flex-wrap gap-4"></div>
                </div>
                <div>
                    <label for="group_photo" class="block text-sm font-medium text-gray-600 mb-2">Group Photo</label>
                    <input type="file" name="group_photo" id="group_photo" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <div id="preview-group" class="mt-4"></div>
                </div>
            </div>
        </div>

        <div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-300 transform hover:scale-105">Register</button>
        </div>
    </form>
</div>

<script>
    // Preview individual images
    const indivInput = document.getElementById('individual_photos');
    const previewIndividualDiv = document.getElementById('preview-individual');
    indivInput.addEventListener('change', () => {
        previewIndividualDiv.innerHTML = '';
        Array.from(indivInput.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'w-24 h-24 object-cover rounded-lg border-2 border-gray-200';
                previewIndividualDiv.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    // Preview group photo
    const groupInput = document.getElementById('group_photo');
    const previewGroupDiv = document.getElementById('preview-group');
    groupInput.addEventListener('change', () => {
        previewGroupDiv.innerHTML = '';
        const file = groupInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'w-32 h-32 object-cover rounded-lg border-2 border-gray-200';
                previewGroupDiv.appendChild(img);
            };
            reader.readAsDataURL(file);
        }
    });

    // ---------- Popup for duplicate phone ----------
    {% if popup_message %}
        window.addEventListener('DOMContentLoaded', () => {
            alert("{{ popup_message }}");
        });
    {% endif %}
</script>

</body>
