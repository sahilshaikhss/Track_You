<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Visitor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">

    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
        Delete Visitor Record
    </h2>

    <form action="/delete" method="POST" class="space-y-4">

        <div>
            <label for="guardian_phone"
                class="block text-sm font-medium text-gray-600 mb-1">

                Guardian Phone Number

            </label>

            <input
                type="text"
                id="guardian_phone"
                name="guardian_phone"
                required

                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
        </div>

        <div>
            <button
                type="submit"

                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300">

                Delete Visitor

            </button>
        </div>

    </form>

    {% if message %}
    <div class="mt-4 p-3 rounded-lg bg-yellow-100 text-yellow-800">
        {{ message }}
    </div>
    {% endif %}

</div>

</body>
</html>
