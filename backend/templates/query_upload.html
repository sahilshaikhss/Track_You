<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search by Image</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100">
<div class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Upload Query Image</h2>
        <form action="http://127.0.0.1:5000/process_query" method="POST" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="query_image" class="block text-sm font-medium text-gray-600 mb-2">Select image</label>
                <input type="file" name="query_image" id="query_image" required
                       class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full 
                              file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 
                              hover:file:bg-blue-100">
            </div>
            <div>
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-300 transform hover:scale-105">
                    Search
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
