<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1b2d">
<title>Track You | Status Updated</title>
<style>
:root{--ink:#0f1b2d;--text:#18253a;--muted:#62728a;--line:#dce3ee;--bg:#eef2f8;--blue:#2f6fed;--blue-d:#2358c4;--ok:#16875a;--okbg:#e4f5ec;--err:#c0392b;--errbg:#fdf3f1;--warn:#8a5a00;--warnbg:#fff1dc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(80% 45% at 50% 0,#dfe8fb 0,transparent 70%),var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{font:inherit}
.top{display:flex;align-items:center;height:64px;padding:0 clamp(16px,4vw,48px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 16px 48px}
.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(24px,5vw,38px);box-shadow:0 1px 2px #10213a0d,0 24px 48px #10213a14;text-align:center}
.badge{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--ok);box-shadow:0 0 0 8px #16875a14;animation:pop .4s ease}
.badge svg{width:38px;height:38px}
.draw{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .55s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
h1{margin:0 0 6px;font-size:clamp(24px,4.5vw,29px);letter-spacing:-.5px;line-height:1.2}
.lead{margin:0 0 22px;color:var(--muted)}
.now{margin:0 0 24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#f7f9fd}
.now small{display:block;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:99px;font-size:16px;font-weight:700;background:#eef2f8;color:var(--muted);word-break:break-word}
.st:before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.st.ok{background:var(--okbg);color:var(--ok)}.st.bad{background:var(--errbg);color:var(--err)}.st.wait{background:var(--warnbg);color:var(--warn)}
.acts{display:grid;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 8px 18px #2f6fed33;transition:.15s}
.btn:hover{background:var(--blue-d)}
.btn:focus-visible,.sec:focus-visible{outline:3px solid #2f6fed55;outline-offset:2px}
.sec{display:inline-block;justify-self:center;color:var(--muted);font-size:14px;text-decoration:none;padding:6px 10px;border-radius:8px}
.sec:hover{background:#eef2f8;color:var(--text)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#ffb347" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="11" r="2.5"/><path d="M7.5 17c.8-2 2.5-3 4.5-3s3.7 1 4.5 3"/></svg></div>Track You</div>
</header>

<div class="wrap">
  <main class="card" role="status">
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Status updated</h1>
    <p class="lead">The new status has been saved.</p>

    <div class="now">
      <small>Current status</small>
      <span class="st" id="st">{{ status }}</span>
    </div>

    <div class="acts">
      <a class="btn" href="{{ url_for('query_upload') }}">Start a new search</a>
      <a class="sec" href="javascript:history.back()">Go back</a>
    </div>
  </main>
</div>

<script>
(function(){
  var s=document.getElementById('st'),t=s.textContent.toLowerCase(),k='';
  if(/not\s*found|fail|error|reject/.test(t))k='bad';
  else if(/found|match|success|complete|done/.test(t))k='ok';
  else if(/pend|process|queue|wait|progress/.test(t))k='wait';
  if(k)s.classList.add(k);
})();
</script>
</body>
</html>
